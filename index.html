<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Managish – Kitchen & Inventory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%3C/text%3E%3C/svg%3E">
<style>:root{
  --navy:#1F3864; --navy2:#16294A; --green:#2F5233; --green2:#203A24; --gold:#C98A2C;
  --bg:#F5F3EE; --card:#FFFFFF; --ink:#22231F; --soft:#64665E; --line:#E3DED2;
  --red:#C0392B; --redbg:#FBE6E3; --orange:#D9822B; --orbg:#FDF0E1; --ok:#2E7D4F; --okbg:#E4F3EA;
  --blue:#2D6CB5; --bluebg:#E6EEF8; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
body.rtl{direction:rtl}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
#top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
#top .brand{font-weight:800;letter-spacing:.04em;font-size:17px;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#top .brand small{font-weight:500;opacity:.75;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:7px 10px;font-size:14px;white-space:nowrap}
#top button.on{background:var(--gold);border-color:var(--gold);color:#1b1b1b;font-weight:700}
#sync{font-size:11px;opacity:.8}
main{padding:14px;max-width:1100px;margin:0 auto 90px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:18px;margin:18px 0 10px}
h3{font-size:16px;margin:14px 0 8px}
.muted{color:var(--soft)}
.small{font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 12px;text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);position:relative}
.tile .ic{font-size:38px;line-height:1}
.tile .tt{font-weight:700;font-size:15px}
.tile .bd{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;border-radius:20px;font-size:12px;font-weight:700;padding:2px 8px}
.tile:active{transform:scale(.98)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{background:var(--navy);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px}
.btn.g{background:var(--green)} .btn.r{background:var(--red)} .btn.o{background:var(--orange)} .btn.w{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px;font-weight:600}
.btn.big{width:100%;padding:16px;font-size:17px}
.btn:disabled{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;background:#eee;white-space:nowrap}
.chip.red{background:var(--redbg);color:var(--red)} .chip.or{background:var(--orbg);color:var(--orange)} .chip.ok{background:var(--okbg);color:var(--ok)} .chip.bl{background:var(--bluebg);color:var(--blue)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:600}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg button.on.ok{background:var(--ok);border-color:var(--ok)} .seg button.on.red{background:var(--red);border-color:var(--red)} .seg button.on.or{background:var(--orange);border-color:var(--orange)}
label.f{display:block;margin:10px 0 4px;font-size:13px;font-weight:700;color:var(--soft)}
input.i,select.i,textarea.i{width:100%;padding:11px 12px;border:1px solid #CFC8B8;border-radius:10px;background:#fff;font-size:16px}
textarea.i{min-height:70px}
input.n{width:90px;padding:10px;border:1px solid #CFC8B8;border-radius:10px;font-size:17px;text-align:center}
table.t{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:8px;font-weight:700;position:sticky;top:0}
table.t td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
table.t tr:nth-child(even) td{background:#FAF9F6}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:70vh}
.list .li{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);background:#fff}
.list .li:first-child{border-radius:12px 12px 0 0} .list .li:last-child{border-radius:0 0 12px 12px;border-bottom:0}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.li .nm{font-weight:700}
.li .sub{font-size:13px;color:var(--soft)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.adm{display:grid;grid-template-columns:200px 1fr;gap:14px}
.adm nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto}
.adm nav button{text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:9px;font-weight:600;color:var(--ink);font-size:14px}
.adm nav button.on{background:var(--navy);color:#fff}
@media(max-width:760px){.adm{grid-template-columns:1fr}.adm nav{position:static;flex-direction:row;overflow-x:auto;max-height:none}.adm nav button{flex:0 0 auto;background:#fff;border:1px solid var(--line)}}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 26px}
@media(min-width:760px){.modal{align-items:center}.modal .box{border-radius:20px}}
.modal .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.modal .hd h2{margin:0;flex:1}
.x{background:#fff;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1d;color:#fff;padding:12px 18px;border-radius:12px;z-index:200;font-weight:600;display:none;max-width:90vw;text-align:center}
.alert{border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.alert.red{background:var(--redbg);color:#7d2116} .alert.or{background:var(--orbg);color:#7a4310} .alert.ok{background:var(--okbg);color:#1d5435} .alert.bl{background:var(--bluebg);color:#1d4677}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:24px}
.kpi span{font-size:12px;color:var(--soft);font-weight:600}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:10px auto}
.pinpad button{height:62px;font-size:24px;font-weight:700;border-radius:14px;border:1px solid var(--line);background:#fff}
.pindots{text-align:center;font-size:34px;letter-spacing:12px;min-height:44px}
.photo-th{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
#pause{position:fixed;inset:0;background:var(--navy2);color:#fff;z-index:999;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:22px;font-weight:700;flex-direction:column;gap:14px}
.voice-orb{width:120px;height:120px;border-radius:50%;margin:20px auto;background:radial-gradient(circle,#4a78c2,#1F3864);display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;box-shadow:0 0 0 0 rgba(45,108,181,.5)}
.voice-orb.listen{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(45,108,181,.55)}100%{box-shadow:0 0 0 28px rgba(45,108,181,0)}}
.chat{max-height:40vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:10px 0}
.chat .m{padding:9px 12px;border-radius:12px;max-width:85%;font-size:15px;white-space:pre-wrap}
.chat .m.u{align-self:flex-end;background:var(--navy);color:#fff}
.chat .m.a{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.hide{display:none!important}
.sticky-bottom{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding-top:14px}
.badge-site{background:var(--gold);color:#1b1b1b;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
@media(max-width:560px){
  #top{gap:5px;padding:8px}
  #top .brand{font-size:15px;gap:5px}
  #top .brand small{display:none}
  #top button{padding:6px 8px;font-size:13px}
  main{padding:10px}
  .tile{min-height:104px;padding:14px 8px}
  .tile .ic{font-size:32px}
}
</style>
</head>

const FIREBASE_CONFIG = null; // ← filled in when the online project is created
async function startRemote() {
  let cfg = FIREBASE_CONFIG; try { cfg = cfg || JSON.parse(LS.get('managish-fb') || 'null'); } catch (e) { }
  if (!cfg) { setSync('Offline mode (this tablet only)'); return; }
  try {
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');

/* ======================= STOCK ENGINE ======================= */
// move: {id, ts, date, site, ref:'it:ID'|'pr:ID', kind, qty (positive), unit, reason, staff, docRef, note, photo, cost}
const SIGN = { in: 1, out: -1, waste: -1, charity: -1, xfer_out: -1, xfer_in: 1, ret_out: -1, ret_in: 1, prod: 1, used: -1, adj: 1, ckuse: -1 };
const USE_KINDS = ['out', 'waste', 'charity', 'ckuse', 'used'];
function refName(ref) { const [ty, id] = String(ref).split(':'); const o = ty === 'pr' ? DB.get('productions', id) : DB.get('items', id); return o ? o.name : (ref.startsWith('tx:') ? ref.slice(3) : '?'); }
function refUnit(ref) { const [ty, id] = ref.split(':'); const o = ty === 'pr' ? DB.get('productions', id) : DB.get('items', id); return o ? (o.unit || 'kg') : ''; }
DB.on(() => { _stockCache = null; _moveIdx = null; });
function moveIndex() {
  if (_moveIdx) return _moveIdx; const ix = {};
  DB.all('moves').forEach(mv => { const k = mv.site + '|' + mv.ref; (ix[k] = ix[k] || []).push(mv); });
  return _moveIdx = ix;
}
function stockMap() {
  if (_stockCache) return _stockCache;
  const m = {}; const ix = moveIndex();
  Object.entries(ix).forEach(([k, arr]) => { m[k] = arr.reduce((a, mv) => a + (SIGN[mv.kind] || 0) * num(mv.qty), 0); });
  return _stockCache = m;
}
function stockOf(site, ref) { return r2(stockMap()[site + '|' + ref] || 0); }
function hasStockRecord(site, ref) { return !!moveIndex()[site + '|' + ref]; }
function usagePerDay(site, ref, days) {
  days = days || DB.settings().usageDays || 14; const from = addDays(today(), -days);
  const arr = moveIndex()[site + '|' + ref]; if (!arr || !arr.length) return null;
  let u = 0, first = null;
  arr.forEach(mv => { if (!first || mv.date < first) first = mv.date; if (mv.date < from) return; if (USE_KINDS.includes(mv.kind) || (site === 'Aljada' && mv.kind === 'xfer_out')) u += num(mv.qty); if (site === 'Aljada' && mv.kind === 'ret_in') u -= num(mv.qty); });
  const age = daysBetween(first, today()); if (age < 3) return null; // not enough data yet
  const span = Math.max(1, Math.min(days, age + 1));
  return Math.max(0, u / span);
}
function nextDeliveryDays(item) {
  const s = DB.settings(); const sup = item && item.cur ? DB.get('suppliers', item.cur) : null;
  let days = (sup && sup.days) ? sup.days.split(/[ ,]+/).map(d => WEEKDAYS.findIndex(w => w.toLowerCase() === d.slice(0, 3).toLowerCase())).filter(x => x >= 0) : Object.keys(s.orderDays || {}).map(Number);
  if (!days.length) days = [1, 3, 5];
  const wd = new Date().getDay(); let best = 7;
  days.forEach(d => { let diff = (d - wd + 7) % 7; if (diff === 0) diff = 7; best = Math.min(best, diff); });
  return best;
}
function itemStatus(site, item) {
  const ref = 'it:' + item.id; const st = stockOf(site, ref); const u = usagePerDay(site, ref);
  const cover = u ? st / u : null; const nd = nextDeliveryDays(item);
  let level = 'ok';
  if (!hasStockRecord(site, ref) && (item.min == null || item.min === '')) level = 'unknown';
  else if (st <= 0) level = 'out';
  else if (item.min != null && item.min !== '' && st <= num(item.min)) level = 'low';
  else if (cover != null && cover < nd + 0.5) level = 'low';
  const suggest = u ? Math.max(0, Math.ceil((u * (nd + 3) - Math.max(0, st)) * 10) / 10) : (item.min ? Math.max(0, num(item.min) * 2 - st) : null);
  return { stock: st, usage: u, cover, level, nextIn: nd, suggest };
}
function levelChip(lv) { if (lv === 'unknown') return '<span class="chip">⚪ not counted yet</span>'; return lv === 'out' ? `<span class="chip red">🔴 ${t('Out of stock')}</span>` : lv === 'low' ? `<span class="chip or">🟠 ${t('Low')}</span>` : `<span class="chip ok">🟢 ${t('OK')}</span>`; }
function stockLine(site, item) {
  const s = itemStatus(site, item);
  if (s.level === 'unknown') return levelChip('unknown');
  const cov = s.usage == null ? '<span class="muted">not enough data yet</span>' : `uses ~${qf(r2(s.usage))} ${esc(item.unit)}/day · ${t('Enough for')} <b>~${s.cover < 1 ? '<1' : Math.floor(s.cover)}</b> ${t('days')}`;
  return `${levelChip(s.level)} ${t('Stock')}: <b>${qf(s.stock)} ${esc(item.unit)}</b> · ${cov}`;
}
function itemPrice(item, supId) { const p = item.prices && item.prices[supId || item.cur]; return p ? num(p.price) : 0; }
function refCost(ref) { const [ty, id] = ref.split(':'); if (ty !== 'it') return 0; const it = DB.get('items', id); return it ? itemPrice(it) : 0; }
function addMove(m) {
  m.id = m.id || uid('mv'); m.ts = m.ts || Date.now(); m.date = m.date || today(); m.site = m.site || DEVICE.site;
  if (m.cost == null) m.cost = r2(refCost(m.ref) * num(m.qty));
  return DB.put('moves', m);
}
/* waste / missing per ref */
function wasteMissing(site, ref, fromIso) {
  let w = 0, wc = 0, miss = 0; DB.all('moves').forEach(mv => { if (mv.ref !== ref || (site && mv.site !== site) || mv.date < fromIso) return; if (mv.kind === 'waste') { w += num(mv.qty); wc += num(mv.cost); } if (mv.kind === 'adj' && num(mv.qty) < 0) miss += -num(mv.qty); });
  return { waste: r2(w), wasteCost: r2(wc), missing: r2(miss) };
}

function pickPhoto(cb, opts = {}) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = opts.accept || 'image/*'; if (opts.camera !== false) inp.capture = 'environment';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; if (opts.raw) return cb(f); compressImage(f, opts.max || 1100, opts.q || .62).then(cb); };
  inp.click();
}
function compressImage(file, max, q) {
  return new Promise(res => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { let w = img.width, h = img.height; const sc = Math.min(1, max / Math.max(w, h)); w = Math.round(w * sc); h = Math.round(h * sc); const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => res(null); img.src = url;
  });
}

function pwLogin(role) {
  const s = DB.settings(); const key = role === 'admin' ? 'adminPw' : 'inspPw';
  const first = !s[key];
  if (first && role === 'insp') { if (!s.adminPw) { toast('Lydia must create the admin password first'); return pwLogin('admin'); } toast('Melissa\'s password is created by the admin in Settings'); return; }
  const b = modal(role === 'admin' ? 'Admin login' : 'Manager Inspection – ' + (s.inspName || 'Melissa'), `${first ? '<div class="alert bl">First time: create the admin password (min 4 characters). Keep it secret.</div>' : ''}

  setTimeout(() => $('#pw', b).focus(), 50);
  const doIt = () => {

    else if (hashPw(p) !== s[key]) return toast('Wrong password');

  };
  $('#ok', b).onclick = doIt; $('#pw', b).onkeydown = e => { if (e.key === 'Enter' && !first) doIt(); };

function staffList(filter) { return DB.all('staff').filter(s => s.active !== false && (!filter || filter(s))).sort((a, b) => a.name.localeCompare(b.name)); }
function whoAreYou(cb, opts = {}) {
  const list = staffList(opts.filter);
  const b = modal(t('Who are you?'), `<div class="tiles">${list.map(s => `<div class="tile" data-id="${s.id}" style="min-height:80px"><div class="ic">👤</div><div class="tt">${esc(s.name)}</div><div class="small muted">${esc(s.role || '')}</div></div>`).join('')}</div>${list.length ? '' : '<div class="alert or">No staff yet – the admin adds staff in Admin → Staff.</div>'}`);
  $$('.tile', b).forEach(el => el.onclick = () => pinPad(DB.get('staff', el.dataset.id), cb));
}
function pinPad(st, cb) {
  let pin = '', pin1 = null; const creating = !st.pin;
  const b = modal(st.name, `<div class="center"><p style="text-align:center" id="pmsg">${creating ? t('Create your PIN (4 digits)') : t('Enter your PIN')}</p><div class="pindots" id="pd"></div>
  <div class="pinpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, '✓'].map(k => `<button data-k="${k}">${k}</button>`).join('')}</div></div>`);
  const draw = () => $('#pd', b).textContent = '●'.repeat(pin.length) + '○'.repeat(Math.max(0, 4 - pin.length));
  draw();
  $$('.pinpad button', b).forEach(x => x.onclick = () => {
    const k = x.dataset.k;
    if (k === '⌫') pin = pin.slice(0, -1); else if (k === '✓' || pin.length >= 3 && k !== '✓') { if (k !== '✓') pin += k; if (pin.length < 4) return draw(); submit(); return; } else pin += k;
    draw();
  });
  function submit() {
    if (creating) {
      if (pin1 == null) { pin1 = pin; pin = ''; $('#pmsg', b).textContent = 'Repeat your PIN'; return draw(); }
      if (pin !== pin1) { pin1 = null; pin = ''; $('#pmsg', b).textContent = 'Not the same – try again'; return draw(); }
      st.pin = hashPw(pin); DB.put('staff', st, 'PIN created'); done();
    } else if (hashPw(pin) === st.pin) done();
    else { pin = ''; draw(); toast(t('Wrong PIN')); }
  }
  function done() { ACTOR = { id: st.id, name: st.name }; closeModal(); cb(st); }
}

async function checkPause() {
  let paused = false, txt = DB.settings().pauseText;
  if (DB.settings().paused) paused = true;
  try { const r = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) { const j = await r.json(); if (j.state === 'paused' || j.state === 'stopped') { paused = true; txt = j.message || (j.state === 'stopped' ? 'This system is stopped. Please check with Lydia.' : 'This system is paused. Please check with Lydia.'); } } } catch (e) { }
  const p = $('#pause'); p.style.display = paused ? 'flex' : 'none'; p.innerHTML = `<div style="font-size:54px">⏸️</div><div>${esc(txt)}</div>${SESSION && SESSION.role === 'admin' ? '' : ''}`;
}

/* ---------- item picker ---------- */
function itemSearch(q, opts = {}) {
  const nq = norm(q); const words = nq.split(' ').filter(Boolean);
  let list = [];
  if (opts.items !== false) list = list.concat(DB.all('items').filter(i => i.active !== false).map(i => ({ ref: 'it:' + i.id, name: i.name, unit: i.unit, o: i, ty: 'item' })));
  if (opts.prods) list = list.concat(DB.all('productions').filter(p => p.active !== false).map(p => ({ ref: 'pr:' + p.id, name: p.name, unit: p.unit || 'kg', o: p, ty: 'prod' })));
  if (opts.supplier) list = list.filter(x => x.ty !== 'item' || (x.o.prices && x.o.prices[opts.supplier]));
  if (words.length) list = list.filter(x => { const n = norm(x.name); return words.every(w => n.includes(w)); });
  return list.sort((a, b) => a.name.localeCompare(b.name));
}
function pickItem(cb, opts = {}) {

  <div class="list" id="res" style="margin-top:10px"></div>`);
  const draw = () => {
    const q = $('#q', b).value; const res = itemSearch(q, opts).slice(0, 60);

    $$('#res .li[data-r]', b).forEach(el => el.onclick = () => { closeModal(); cb(el.dataset.r); });

function returnDialog(name, unit, cb) {

  $('#rp', b).onclick = () => pickPhoto(p => { photo = p; $('#rph', b).innerHTML = photoHtml(p); });

function summarizeDiffs(st) {
  const d = [];
  st.lines.forEach((l, i) => {
    if (l.rs === 'none') d.push({ c: 'red', t: `❌ <b>${esc(lineName(l))}</b> – not received (ordered ${qf(l.qty)} ${esc(l.unit)})` });
    else if (num(l.recvQty) !== num(l.qty)) d.push({ c: 'or', t: `⚖️ <b>${esc(lineName(l))}</b> – ordered ${qf(l.qty)}, received ${qf(l.recvQty)} ${esc(l.unit)} (${num(l.recvQty) > num(l.qty) ? '+' : ''}${qf(r2(num(l.recvQty) - num(l.qty)))})` });
    if (l.quality === 'bad') d.push({ c: 'red', t: `⚠️ <b>${esc(lineName(l))}</b> – quality problem: ${esc(l.qnote || '')}` });
  });
  (st.returns || []).forEach(r => d.push({ c: 'red', t: `↩️ <b>${esc(lineName(st.lines[r.line]))}</b> – returned ${qf(r.qty)}: ${esc(r.reason)}${r.note ? ' – ' + esc(r.note) : ''}` }));
  (st.extras || []).forEach(x => d.push({ c: 'or', t: `➕ <b>${esc(lineName(x))}</b> – ${qf(x.qty)} ${esc(x.unit)} received but NOT ordered (${x.action})` }));
  return d;
}

function kitchenRequest(el, supId, rid) {

  let filter = '';

  const draw = () => {
    const list = items().map(i => ({ i, st: itemStatus(DEVICE.site, i) })).filter(x => !filter || norm(x.i.name).includes(norm(filter))).sort((a, b) => ({ out: 0, low: 1, ok: 2, unknown: 3 }[a.st.level] - { out: 0, low: 1, ok: 2, unknown: 3 }[b.st.level]) || a.i.name.localeCompare(b.i.name));

      <div class="row"><input class="n" data-k="${k}" type="number" step="any" inputmode="decimal" placeholder="0" value="${c ? c.qty : ''}"><select class="i" data-u="${k}" style="width:auto;padding:9px">${[i.unit].concat(s.units.filter(u => u !== i.unit)).map(u => `<option ${c && c.unit === u ? 'selected' : ''}>${u}</option>`).join('')}</select></div></div>`; }).join('') || '<div class="li muted">No items for this supplier yet.</div>'}
    ${Object.entries(sel).filter(([k]) => k.startsWith('tx:')).map(([k, c]) => `<div class="li"><div class="grow"><div class="nm">➕ ${esc(c.name)}</div></div><b>${qf(c.qty)} ${esc(c.unit)}</b><button class="btn w sm" data-rm="${esc(k)}">✕</button></div>`).join('')}</div>

    <div class="sticky-bottom"><button class="btn big g" id="send" ${chosen ? '' : 'disabled'}>📲 Create PO image & send to ${esc(s.ownerName || 'Lydia')} (${chosen})</button></div>`;
    $('#f').oninput = e => { filter = e.target.value; const pos = e.target.selectionStart; draw(); const f = $('#f'); f.focus(); f.setSelectionRange(pos, pos); };
    $$('[data-k]').forEach(inp => inp.onchange = () => { const k = inp.dataset.k; const q = num(inp.value); if (q > 0) sel[k] = { qty: q, unit: $(`[data-u="${k}"]`).value }; else delete sel[k]; draw(); });
    $$('[data-u]').forEach(u => u.onchange = () => { const k = u.dataset.u; if (sel[k]) sel[k].unit = u.value; });
    $$('[data-rm]').forEach(b => b.onclick = () => { delete sel[b.dataset.rm]; draw(); });

    `<h3>Recent</h3><div class="list">${reqs.slice(0, 6).map(r => `<div class="li"><div class="grow"><div class="nm">Request ${fmtD(r.date)} · ${r.lines.length} items</div><div class="sub">by ${esc(r.by)}${r.sentBy ? ' · sent by ' + esc(r.sentBy) : ''}${r.recvBy ? ' · received by ' + esc(r.recvBy) : ''}</div></div><span class="chip ${r.status === 'received' ? 'ok' : 'bl'}">${r.status}</span></div>`).join('')}${rets.slice(0, 4).map(r => `<div class="li"><div class="grow"><div class="nm">Night return ${fmtD(r.date)}</div><div class="sub">by ${esc(r.by)}${r.confirmedBy ? ' · confirmed by ' + esc(r.confirmedBy) : ''}</div></div><span class="chip ${r.status === 'confirmed' ? 'ok' : 'or'}">${r.status}</span></div>`).join('') || ''}</div>`;
});
function ckLinesEditor(title, lines, onSave, opts = {}) {
  const draw = (b) => {
    b.innerHTML = `${lines.map((l, i) => `<div class="li" style="background:#fff;border-radius:10px;margin-bottom:6px"><div class="grow"><div class="nm">${esc(refName(l.ref))}</div>${opts.showAsked ? `<div class="sub">asked ${qf(l.asked)} ${esc(l.unit)}</div>` : ''}${opts.showStock ? `<div class="sub">Aljada stock ${qf(stockOf('Aljada', l.ref))}</div>` : ''}</div><input class="n" data-i="${i}" type="number" step="any" value="${l.qty}"> <span class="small">${esc(l.unit)}</span>${opts.noRemove ? '' : `<button class="btn w sm" data-d="${i}">✕</button>`}</div>`).join('')}
    ${opts.noAdd ? '' : '<button class="btn w" id="ad">+ Add item</button>'}<div style="margin-top:12px"><button class="btn big g" id="sv">${opts.btn || t('Save')}</button></div>`;
    $$('[data-i]', b).forEach(inp => inp.onchange = () => lines[+inp.dataset.i].qty = num(inp.value));
    $$('[data-d]', b).forEach(x => x.onclick = () => { lines.splice(+x.dataset.d, 1); draw(b); });
    if ($('#ad', b)) $('#ad', b).onclick = () => { closeModal(); pickItem(r => { lines.push({ ref: r, qty: 1, unit: refUnit(r), asked: 0 }); open(); }, { prods: true, site: 'Aljada' }); };
    $('#sv', b).onclick = () => onSave(lines);
  };
  const open = () => { const b = modal(title, ''); draw(b); };
  open();
}
function ckNewRequest() { ckLinesEditor('Request to Aljada', [], lines => { if (!lines.length) return toast('Add items'); whoAreYou(st => { DB.put('ckreq', { date: today(), lines: lines.filter(l => l.qty > 0).map(l => Object.assign(l, { asked: l.qty })), by: st.name, status: 'requested' }); closeModal(); toast('Request sent to Aljada'); render(); }); }, { btn: '📤 Send request' }); }
function ckSend() {
  const r = DB.all('ckreq').filter(x => x.status === 'requested').sort((a, b) => a._ts - b._ts)[0];
  if (!r) return toast('No request from the cloud kitchen');
  const lines = r.lines.map(l => ({ ref: l.ref, unit: l.unit, asked: l.asked || l.qty, qty: l.asked || l.qty }));
  ckLinesEditor('Send to Cloud Kitchen – request of ' + fmtD(r.date) + ' by ' + r.by, lines, ls => whoAreYou(st => {
    ls.filter(l => l.qty > 0).forEach(l => addMove({ site: 'Aljada', ref: l.ref, kind: 'xfer_out', qty: l.qty, unit: l.unit, reason: 'To Cloud Kitchen', staff: st.name, docRef: r.id }));
    Object.assign(r, { lines: ls, status: 'sent', sentBy: st.name, sentAt: Date.now() }); DB.put('ckreq', r, 'sent to CK'); closeModal(); toast('✓ Sent – the cloud kitchen confirms on arrival'); render();
  }), { showAsked: true, showStock: true, btn: '📤 Prepared & sent' });
}
function ckReceive() {
  const r = DB.all('ckreq').filter(x => x.status === 'sent').sort((a, b) => a._ts - b._ts)[0];
  if (!r) return toast('Nothing on the way');
  const lines = r.lines.filter(l => l.qty > 0).map(l => ({ ref: l.ref, unit: l.unit, asked: l.qty, qty: l.qty }));
  ckLinesEditor('What arrived from Aljada?', lines, ls => whoAreYou(st => {
    ls.forEach(l => { if (l.qty > 0) addMove({ site: 'Cloud Kitchen', ref: l.ref, kind: 'xfer_in', qty: l.qty, unit: l.unit, reason: 'From Aljada', staff: st.name, docRef: r.id }); });
    const diffs = ls.filter(l => num(l.qty) !== num(l.asked)).map(l => `${refName(l.ref)}: sent ${qf(l.asked)}, arrived ${qf(l.qty)}`);
    Object.assign(r, { status: 'received', recvBy: st.name, recvAt: Date.now(), recvLines: ls, diffs }); DB.put('ckreq', r, 'CK received'); closeModal(); toast(diffs.length ? '⚠️ Differences saved for Lydia' : '✓ Received'); render();
  }), { showAsked: true, noAdd: true, noRemove: true, btn: '✓ Confirm arrival' });
}
function ckNight() {
  const site = 'Cloud Kitchen';
  const refs = Object.keys(stockMap()).filter(k => k.startsWith(site + '|')).map(k => k.split('|')[1]).filter(ref => stockOf(site, ref) > 0);
  if (!refs.length) return toast('No stock at the cloud kitchen today');
  const rows = refs.map(ref => { const it = ref.startsWith('it:') ? DB.get('items', ref.slice(3)) : null; return { ref, expected: stockOf(site, ref), left: '', action: it && !it.perishable ? 'keep' : 'return', unit: refUnit(ref) }; });
  const draw = b => {
    b.innerHTML = `<p class="small">For each item: how much is <b>left</b> now, and is it going back to Aljada or staying here?</p>${rows.map((r, i) => `<div class="card"><b>${esc(refName(r.ref))}</b> <span class="small muted">(had ${qf(r.expected)} ${esc(r.unit)})</span><div class="row" style="margin-top:6px">Left: <input class="n" data-l="${i}" type="number" step="any" value="${r.left}"> ${esc(r.unit)}<div class="seg"><button class="${r.action === 'return' ? 'on or' : ''}" data-a="${i}" data-v="return">↩️ Return</button><button class="${r.action === 'keep' ? 'on ok' : ''}" data-a="${i}" data-v="keep">📦 Keep</button></div></div></div>`).join('')}
    <button class="btn big g" id="sv">✓ Send night report</button>`;
    $$('[data-l]', b).forEach(x => x.onchange = () => rows[+x.dataset.l].left = x.value);
    $$('[data-a]', b).forEach(x => x.onclick = () => { rows[+x.dataset.a].action = x.dataset.v; draw(b); });
    $('#sv', b).onclick = () => {
      if (rows.some(r => r.left === '')) return toast('Enter what is left for every item (0 if nothing)');
      whoAreYou(st => {
        const ret = { date: today(), by: st.name, status: 'sent', lines: [] };
        rows.forEach(r => { const left = num(r.left); const used = Math.max(0, r2(r.expected - left)); if (used > 0) addMove({ site, ref: r.ref, kind: 'ckuse', qty: used, unit: r.unit, reason: 'Cloud kitchen daily usage', staff: st.name }); if (left > r.expected) addMove({ site, ref: r.ref, kind: 'adj', qty: r2(left - r.expected), unit: r.unit, reason: 'Night report: more than expected', staff: st.name }); if (r.action === 'return' && left > 0) { addMove({ site, ref: r.ref, kind: 'ret_out', qty: left, unit: r.unit, reason: 'Night return to Aljada', staff: st.name }); ret.lines.push({ ref: r.ref, qty: left, unit: r.unit }); } });
        if (ret.lines.length) DB.put('ckret', ret); closeModal(); toast('✓ Night report saved'); render();
      });
    };
  };
  const b = modal('Night report – Cloud Kitchen', ''); draw(b);
}
function ckConfirmReturn() {
  const r = DB.all('ckret').filter(x => x.status === 'sent').sort((a, b) => a._ts - b._ts)[0];
  if (!r) return toast('No return waiting');
  const lines = r.lines.map(l => ({ ref: l.ref, unit: l.unit, asked: l.qty, qty: l.qty }));
  ckLinesEditor('Confirm return of ' + fmtD(r.date) + ' (by ' + r.by + ')', lines, ls => whoAreYou(st => {

    const diffs = ls.filter(l => num(l.qty) !== num(l.asked)).map(l => `${refName(l.ref)}: reported ${qf(l.asked)}, arrived ${qf(l.qty)}`);
    Object.assign(r, { status: 'confirmed', confirmedBy: st.name, diffs, recvLines: ls }); DB.put('ckret', r, 'CK return confirmed'); closeModal(); toast(diffs.length ? '⚠️ Differences saved for Lydia' : '✓ Return confirmed'); render();

}

    <div class="sticky-bottom"><button class="btn big g" id="sv">✓ Save count (${Object.keys(counted).length})</button></div>`;

function saveCount(counted, who) {
  const lines = []; let miss = 0;
  Object.entries(counted).forEach(([id, c]) => { const ref = 'it:' + id; const sys = stockOf(DEVICE.site, ref); const diff = r2(c - sys); lines.push({ ref, system: sys, counted: c, diff }); if (diff !== 0) { const first = !DB.all('moves').some(m => m.ref === ref && m.site === DEVICE.site); addMove({ ref, kind: 'adj', qty: diff, unit: refUnit(ref), reason: first ? 'Starting count' : (diff < 0 ? 'Missing at count' : 'Found extra at count'), staff: who, start: first }); if (diff < 0 && !first) miss++; } });
  DB.put('counts', { date: today(), site: DEVICE.site, by: who, lines }); toast(`✓ Count saved${miss ? ' – ' + miss + ' item(s) missing' : ''}`); go('#/');
}

    if (hi < 0) hi = 0; const hdr = rows[hi].map(x => String(x).toLowerCase()); const di = hdr.findIndex(x => x.includes('desc')), qi = hdr.findIndex(x => x.includes('quant')), ui = hdr.findIndex(x => x.includes('unit'));

}
function lev(a, b) { if (Math.abs(a.length - b.length) > 2) return 9; const m = []; for (let i = 0; i <= a.length; i++) { m[i] = [i]; for (let j = 1; j <= b.length; j++) m[i][j] = i ? Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)) : j; } return m[a.length][b.length]; }

function matchItem(name, supId) {
  const words = norm(name).split(' ').filter(w => w.length > 1 && !['per', 'kg', 'the', 'and'].includes(w)); if (!words.length) return null;
  let best = null, bs = 0;
  DB.all('items').filter(i => i.active !== false).forEach(i => {
    const iw = norm(i.name.replace(/\(.*?\)/g, ' ')).split(' ').filter(w => w.length > 1);
    if (!iw.length) return;
    const cover = words.reduce((a, w) => a + wordSim(w, iw) * w.length, 0) / words.reduce((a, w) => a + w.length, 0);
    const back = iw.reduce((a, w) => a + wordSim(w, words) * w.length, 0) / iw.reduce((a, w) => a + w.length, 0);
    let sc = cover * .7 + back * .3;
    if (supId) sc *= (i.prices && i.prices[supId]) ? 1.15 : .8;

}

function foodCost(from, to, site) {

    return `<label class="f">${esc(f.label)}</label><input class="i" data-k="${f.k}" type="${f.type || 'text'}" ${f.type === 'number' ? 'step="any"' : ''} value="${esc(v)}" ${f.ph ? `placeholder="${esc(f.ph)}"` : ''}>`;
  }).join('');
  const b = modal(title, `${html}<div class="row" style="margin-top:16px"><button class="btn g grow" id="fs">✓ Save</button>${onDelete ? '<button class="btn r" id="fd">🗑️ Delete</button>' : ''}</div>`);
  $$('[data-m] button', b).forEach(x => x.onclick = () => x.classList.toggle('on'));
  $('#fs', b).onclick = () => {
    fields.forEach(f => {
      if (f.type === 'multi') { obj[f.k] = $$(`[data-m="${f.k}"] button.on`, b).map(x => x.dataset.v); return; }
      const e = $(`[data-k="${f.k}"]`, b); if (!e) return;
      if (f.type === 'bool') obj[f.k] = e.checked; else if (f.type === 'number') obj[f.k] = e.value === '' ? null : num(e.value); else if (f.type === 'list') obj[f.k] = e.value.split('\n').map(x => x.trim()).filter(Boolean); else obj[f.k] = e.value.trim();
    });
    const req = fields.find(f => f.req && !obj[f.k]); if (req) return toast(req.label + ' is required');
    closeModal(); onSave(obj);
  };
  if (onDelete) $('#fd', b).onclick = () => confirmBox('Delete “' + (obj.name || 'this') + '”?', () => { closeModal(); onDelete(obj); }, 'Delete', true);
}

  };

}

function poFromParsed(res, photo) {
  const sup = matchSupplier(res.supplier);
  const po = { date: res.date || today(), supplierId: sup ? sup.id : '', site: 'Aljada', lines: res.lines.map(l => { const it = matchItem(l.name, sup && sup.id); return { ref: it ? 'it:' + it.id : '', name: l.name, qty: l.qty, unit: l.unit || (it && it.unit) || 'kg', price: it ? itemPrice(it, sup && sup.id) : 0, matched: !!it }; }), status: 'draft', source: photo ? 'photo' : 'excel', photo: photo || '', createdBy: SESSION.name };
  if (!res.lines.length) toast('No lines found – please add them by hand');
  editPO($('#as'), null, po);
}

function enterInvoice(pid, after) {
  const p = DB.get('pos', pid); let photo = p.invoicePhoto || '';
  const b = modal('Invoice – ' + supName(p.supplierId), `<div class="grid2"><div><label class="f">Invoice number</label><input class="i" id="in" value="${esc(p.invoiceNo || '')}"></div><div><label class="f">Invoice date</label><input class="i" type="date" id="idt" value="${p.invoiceDate || isoDate(p.recvAt)}"></div></div>
  <div class="row" style="margin-top:8px"><button class="btn w sm" id="ip">📷 Invoice photo / scan</button><span id="iph">${photoHtml(photo)}</span></div>
  <h3>Prices on the invoice (per unit)</h3>${p.lines.map((l, i) => { const it = l.ref ? DB.get('items', l.ref.slice(3)) : null; const last = it ? itemPrice(it, p.supplierId) : 0; return `<div class="row" style="border-bottom:1px solid var(--line);padding:6px 0"><span class="grow">${esc(lineName(l))}<br><span class="small muted">received ${qf(l.recvQty)} ${esc(l.unit)} · last price ${last ? aed(last) : '—'}</span></span><input class="n" data-pr="${i}" type="number" step="any" value="${l.price || last || ''}"></div>`; }).join('')}
  <div style="margin-top:12px"><button class="btn big g" id="ok">✓ Save invoice</button></div>`);
  $('#ip', b).onclick = () => pickPhoto(ph => { photo = ph; $('#iph', b).innerHTML = photoHtml(ph); }, { max: 1600, q: .7 });
  $('#ok', b).onclick = () => {
    $$('[data-pr]', b).forEach(x => { const l = p.lines[+x.dataset.pr]; const np = num(x.value); if (!np || !l.ref) return; l.price = np; recordPrice(l.ref.slice(3), p.supplierId, np, $('#idt', b).value || today()); });
    Object.assign(p, { invoiceNo: $('#in', b).value, invoiceDate: $('#idt', b).value, invoicePhoto: photo, invoiceStatus: 'done', invoiceTotal: r2(p.lines.reduce((a, l) => a + num(l.price) * num(l.recvQty), 0)) });
    DB.put('pos', p, 'invoice entered');
    // fix cost of the stock-in moves with the real price
    DB.all('moves').filter(m => m.docRef === p.id && m.kind === 'in').forEach(m => { const l = p.lines.find(x => x.ref === m.ref); if (l && l.price) { m.cost = r2(l.price * num(m.qty)); DB.put('moves', m, false); } });
    closeModal(); toast('✓ Invoice saved'); after && after();
  };
}
function recordPrice(itemId, supId, newP, date) {
  const it = DB.get('items', itemId); if (!it) return; it.prices = it.prices || {};
  const cur = it.prices[supId]; const old = cur ? num(cur.price) : 0;
  if (old && Math.abs(newP - old) > 0.001) {
    const pct = r2((newP - old) / old * 100);
    const others = Object.entries(it.prices).filter(([s, v]) => s !== supId && num(v.price) > 0 && num(v.price) < newP).sort((a, b) => a[1].price - b[1].price)[0];
    DB.put('pricealerts', { date, itemId, item: it.name, supplierId: supId, supplier: supName(supId), old, new: newP, pct, status: 'open', cheaper: others ? supName(others[0]) + ' (' + others[1].price + ')' : '' }, false);
  }
  const p = cur || { price: newP, hist: [] }; p.hist = (p.hist || []); if (!p.hist.length || p.hist[p.hist.length - 1][1] !== newP) p.hist.push([date, newP]); p.price = newP; it.prices[supId] = p; if (!it.cur) it.cur = supId;
  DB.put('items', it, false);
}

ADMIN.waste = el => {

    const grp = (arr, key) => { const g = {}; arr.forEach(m => { const k = key(m); g[k] = g[k] || { q: 0, c: 0, n: 0, u: m.unit }; g[k].q += Math.abs(num(m.qty)); g[k].c += Math.abs(num(m.cost)); g[k].n++; }); return Object.entries(g).sort((a, b) => b[1].c - a[1].c); };
    const tbl = (rows, lab) => `<div class="tw" style="max-height:300px"><table class="t"><thead><tr><th>${lab}</th><th>Times</th><th>Qty</th><th>Cost</th></tr></thead><tbody>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.n}</td><td>${qf(r2(v.q))} ${esc(v.u || '')}</td><td>${aed(v.c)}</td></tr>`).join('') || '<tr><td colspan=4 class="muted">—</td></tr>'}</tbody></table></div>`;

    <div class="kpis" style="margin-top:10px"><div class="kpi"><span>Waste</span><b style="color:var(--red)">${aed(w.reduce((a, m) => a + num(m.cost), 0))}</b></div><div class="kpi"><span>Charity</span><b>${aed(c.reduce((a, m) => a + num(m.cost), 0))}</b></div><div class="kpi"><span>Missing</span><b style="color:var(--orange)">${aed(-miss.reduce((a, m) => a + num(m.cost), 0))}</b></div></div>

    <h3>All waste entries</h3><div class="list">${w.sort((a, b) => b.ts - a.ts).slice(0, 100).map(m => `<div class="li"><div class="grow"><div class="nm">${esc(refName(m.ref))} – ${qf(m.qty)} ${esc(m.unit)} · ${aed(m.cost)}</div><div class="sub">${fmtDT(m.ts)} · ${esc(m.site)} · ${esc(m.staff)} · ${esc(m.reason)}${m.note ? ' · ' + esc(m.note) : ''}</div></div>${photoHtml(m.photo)}</div>`).join('') || '<div class="li muted">—</div>'}</div>`;
    $('#f').onchange = e => { from = e.target.value; draw(); }; $('#t').onchange = e => { to = e.target.value; draw(); };
  };
  draw();

    $('#f').onchange = e => { from = e.target.value; draw(); }; $('#t').onchange = e => { to = e.target.value; draw(); };
    $$('[data-r]').forEach(b => b.onclick = () => { const r = b.dataset.r; to = today(); from = r === 'd' ? today() : r === 'w' ? addDays(today(), -((new Date().getDay() + 6) % 7)) : today().slice(0, 8) + '01'; draw(); });
    const txt = () => { const L = [`MANAGISH REPORT ${fmtD(from)} – ${fmtD(to)}`, '', `Purchases: ${aed(f.purchases)}`, `Used: ${aed(f.used)}`, `Waste: ${aed(f.waste)}`, `Charity: ${aed(f.charity)}`, `Missing: ${aed(f.missing)}`, '', 'Purchases by supplier:'].concat(Object.entries(bySup).map(([k, v]) => `• ${k}: ${aed(v.v)} (${v.n} deliveries${v.d ? ', ' + v.d + ' differences' : ''})`)); if (from === to) L.push('', dailySummaryText(from)); return L.join('\n'); };
    $('#xl').onclick = () => exportExcel(from, to).catch(() => toast('Excel export needs internet – please check the connection'));
    $('#em').onclick = () => sendEmail(`Managish report ${fmtD(from)} – ${fmtD(to)}`, txt());
    $('#wa').onclick = () => shareImage(reportImage('MANAGISH REPORT', txt()), `Report_${from}_${to}.png`, txt(), null, DB.settings().waGroup);
  };
  draw();
};

/* ---------- SETTINGS ---------- */
ADMIN.settings = el => {

  el.innerHTML = `<h1>Settings</h1>

  <div class="card"><h3 style="margin-top:0">✉️ Emails & WhatsApp</h3><label class="f">Report emails (one per line)</label><textarea class="i" id="em">${esc((s.emails || []).join('\n'))}</textarea><label class="f">Inspection report – extra emails (Melissa…)</label><textarea class="i" id="ie">${esc((s.inspEmails || []).join('\n'))}</textarea>
  <div class="grid2"><div><label class="f">My WhatsApp number (Kitchen Requests)</label><input class="i" id="wa" value="${esc(s.whatsapp || '')}"></div><div><label class="f">WhatsApp group for reports</label><input class="i" id="wg" value="${esc(s.waGroup || '')}"></div></div>
  <details style="margin-top:10px"><summary><b>Automatic daily email (EmailJS)</b></summary><p class="small muted">Without this, emails open in the mail app. With a free EmailJS account the daily report is sent automatically after the hour below (when a tablet is on).</p><div class="grid2"><input class="i" id="ej1" placeholder="Service ID" value="${esc(s.emailjs.service || '')}"><input class="i" id="ej2" placeholder="Template ID" value="${esc(s.emailjs.template || '')}"><input class="i" id="ej3" placeholder="Public key" value="${esc(s.emailjs.key || '')}"><input class="i" id="ejh" type="number" placeholder="Hour (23)" value="${s.dailyEmailHour || 23}"></div></details>
  <button class="btn g" id="sv1" style="margin-top:10px">Save</button></div>
  <div class="card"><h3 style="margin-top:0">🧾 Lists (one per line)</h3><div class="grid2">${[['receivers', 'People who can stamp & sign'], ['wasteReasons', 'Waste reasons'], ['takeReasons', 'Take reasons'], ['returnReasons', 'Return reasons'], ['itemCats', 'Item categories'], ['productionCats', 'Production categories'], ['units', 'Units'], ['allergens', 'Allergens'], ['sites', 'Sites']].map(([k, l]) => `<div><label class="f">${l}</label><textarea class="i" data-l="${k}" style="min-height:110px">${esc((s[k] || []).join('\n'))}</textarea></div>`).join('')}</div>
  <div class="grid2"><div><label class="f">Chiller max °C</label><input class="i" id="cm" type="number" value="${s.chillerMax}"></div><div><label class="f">Freezer max °C</label><input class="i" id="fm" type="number" value="${s.freezerMax}"></div><div><label class="f">Days used to calculate usage</label><input class="i" id="ud" type="number" value="${s.usageDays}"></div><div><label class="f">Owner name</label><input class="i" id="on" value="${esc(s.ownerName || 'Lydia')}"></div></div>
  <label class="f">Order days</label>${[1, 2, 3, 4, 5, 6, 0].map(d => `<div class="row" style="margin-top:4px"><span style="width:44px">${WEEKDAYS[d]}</span><input class="i grow" data-od="${d}" value="${esc((s.orderDays || {})[d] || '')}" placeholder="no order"></div>`).join('')}
  <button class="btn g" id="sv2" style="margin-top:10px">Save</button></div>
  <div class="card"><h3 style="margin-top:0">🎤 Voice – Level 2 (AI conversation)</h3><p class="small muted">Optional. Needs the small secure server (Cloudflare Worker) with your Anthropic API key. Leave empty to use the built-in voice.</p><label class="f">Server address</label><input class="i" id="ai" value="${esc(s.ai.endpoint || '')}" placeholder="https://managish-voice.yourname.workers.dev"><button class="btn g" id="sv3" style="margin-top:10px">Save</button></div>
  <div class="card"><h3 style="margin-top:0">☁️ Online storage (shared between tablets)</h3><p class="small">${LS.get('managish-fb') || FIREBASE_CONFIG ? '✅ Connected configuration present.' : '❗ Not connected: data stays on this tablet only.'}</p><label class="f">Firebase config (JSON)</label><textarea class="i" id="fb" placeholder='{"apiKey":"…","projectId":"…"}'>${esc(LS.get('managish-fb') || '')}</textarea><button class="btn g" id="sv4" style="margin-top:10px">Save & reload</button></div>
  <div class="card"><h3 style="margin-top:0">💾 Backup</h3><div class="row"><button class="btn w" id="bk">⬇️ Download backup</button><button class="btn w" id="rs">⬆️ Restore backup</button></div></div>
  <details class="card"><summary><b>Emergency</b></summary><p class="small muted">Hidden pause switch (backup if the chat with Claude is not available).</p><button class="btn ${s.paused ? 'g' : 'r'}" id="pz">${s.paused ? '▶️ Resume the system' : '⏸️ Pause the system'}</button></details>`;
  const pwSet = (key, label) => { const b = modal(label, `<label class="f">New</label><input class="i" type="password" id="p1"><label class="f">Repeat</label><input class="i" type="password" id="p2"><div style="margin-top:12px"><button class="btn big" id="ok">Save</button></div>`); $('#ok', b).onclick = () => { const a = $('#p1', b).value; if (a.length < 4 || a !== $('#p2', b).value) return toast('Must match (min 4)'); DB.saveSettings({ [key]: hashPw(a) }); closeModal(); toast('Saved'); render(); }; };
  $('#pa').onclick = () => pwSet('adminPw', 'Admin password'); $('#pi').onclick = () => pwSet('inspPw', (s.inspName || 'Melissa') + '\'s inspection password'); $('#pv').onclick = () => pwSet('voiceCode', 'Voice code'); $('#pb').onclick = () => pwSet('bossVoiceCode', (s.bossName || 'Mr. Ahmed') + '\'s voice code'); $('#inn').onchange = e => { DB.saveSettings({ inspName: e.target.value.trim() || 'Melissa' }); toast('Saved'); }; $('#bn').onchange = e => { DB.saveSettings({ bossName: e.target.value.trim() || 'Mr. Ahmed' }); toast('Saved'); };

  $('#sv3').onclick = () => { DB.saveSettings({ ai: Object.assign({}, s.ai, { endpoint: $('#ai').value.trim() }) }); toast('Saved'); };
  $('#sv4').onclick = () => { const v = $('#fb').value.trim(); if (!v) { localStorage.removeItem('managish-fb'); location.reload(); return; } try { const body = v.slice(v.indexOf('{'), v.lastIndexOf('}') + 1); let j; try { j = JSON.parse(body); } catch (e) { j = new Function('return (' + body + ')')(); } if (!j.projectId) throw 0; LS.set('managish-fb', JSON.stringify(j)); location.reload(); } catch (e) { toast('Not valid – paste the config object'); } };
  $('#bk').onclick = () => { const blob = new Blob([JSON.stringify(DB.data)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `managish_inventory_backup_${today()}.json`; a.click(); };
  $('#rs').onclick = () => pickPhoto(f => { f.text().then(tx => { try { const d = JSON.parse(tx); if (!d.items) throw 0; confirmBox('Replace ALL data on this tablet with the backup?', () => { DB.data = d; DB.persist(); if (DB.remote) COLS.forEach(c => DB.all(c, true).forEach(o => DB.remote.write(c, o))); location.reload(); }, 'Restore', true); } catch (e) { toast('Not a valid backup'); } }); }, { raw: true, accept: '.json', camera: false });
  $('#pz').onclick = () => { DB.saveSettings({ paused: !s.paused }); checkPause(); render(); };
};

/* ---------- HISTORY ---------- */
ADMIN.history = el => {
  const rows = DB.all('audit').sort((a, b) => b.ts - a.ts).slice(0, 400);
  el.innerHTML = `<h1>History (who changed what)</h1><div class="tw"><table class="t"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>What</th></tr></thead><tbody>${rows.map(a => `<tr><td>${fmtDT(a.ts)}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.col)} · ${esc(a.label || '')} ${esc(a.msg || '')}</td></tr>`).join('')}</tbody></table></div>`;
};

/* ================= BOOT ================= */
function boot() {
  DB.init(); applyLang();
  render();
  startRemote();
  runStanding();
  checkPause(); setInterval(checkPause, 60000);
  setInterval(() => { runStanding(); maybeDailyEmail(); }, 5 * 60000);
  setTimeout(maybeDailyEmail, 8000);
  if (!DB.settings().adminPw) setTimeout(() => toast('Welcome! Lydia: tap 🔐 → Admin to create your password.', 5000), 600);
}
document.addEventListener('DOMContentLoaded', boot);
</script>
